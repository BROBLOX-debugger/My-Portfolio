<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Justin Miranda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@300;400;500;600&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2em 1em;
            background: 
                radial-gradient(ellipse at top left, rgba(255,192,110,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(255,192,110,0.1) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a0a 0%, #1a1200 50%, #0a0a0a 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Gold shimmer orbs */
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,192,110,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,192,110,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .brand {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffc06e, #ffdf9e, #ffc06e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: .2em;
            text-align: center;
            letter-spacing: .02em;
        }

        .brand-sub {
            font-size: .82rem;
            color: #a07840;
            margin-bottom: 2.5em;
            text-align: center;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .card {
            background: linear-gradient(145deg, #1a1a0f, #111108);
            border: 1px solid rgba(255,192,110,0.25);
            border-radius: 1em;
            padding: 2.5em 2em;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,192,110,0.08),
                inset 0 1px 0 rgba(255,192,110,0.1);
            position: relative;
            z-index: 1;
        }

        /* Gold top accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffc06e, transparent);
            border-radius: 1px;
        }

        .card h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: .25em;
            color: #fff;
        }

        .card p.subtitle {
            font-size: .875rem;
            color: #666;
            margin-bottom: 2em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: .4em;
            margin-bottom: 1.1em;
        }

        label {
            font-size: .75rem;
            font-weight: 500;
            color: #a07840;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        input {
            background-color: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,192,110,0.2);
            border-radius: .5em;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: .95rem;
            padding: .75em 1em;
            transition: border-color 200ms ease, background 200ms ease;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: #ffc06e;
            background-color: rgba(255,192,110,0.05);
        }

        input::placeholder { color: #444; }

        .btn {
            width: 100%;
            padding: .85em;
            background: linear-gradient(135deg, #ffc06e, #ffad4a);
            border: none;
            border-radius: .5em;
            color: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: .5em;
            transition: opacity 200ms ease, transform 100ms ease;
            letter-spacing: .02em;
        }

        .btn:hover { opacity: .9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        #status {
            text-align: center;
            font-size: .875rem;
            margin-top: 1em;
            min-height: 1.2em;
        }

        .success { color: #4caf50; }
        .error   { color: #f44336; }

        .register-box {
            text-align: center;
            border: 1px solid rgba(255,192,110,0.15);
            border-radius: .75em;
            padding: 1.25em;
            margin-top: 1.25em;
            width: 100%;
            max-width: 420px;
            background: rgba(255,192,110,0.03);
            position: relative;
            z-index: 1;
        }

        .register-box p {
            font-size: .875rem;
            color: #666;
            margin-bottom: .75em;
        }

        .btn-outline {
            display: block;
            width: 100%;
            padding: .75em;
            background: transparent;
            border: 1px solid rgba(255,192,110,0.4);
            border-radius: .5em;
            color: #ffc06e;
            font-family: 'Poppins', sans-serif;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 200ms ease;
        }

        .btn-outline:hover {
            background: rgba(255,192,110,0.1);
            border-color: #ffc06e;
        }

        .back-link {
            margin-top: 1.25em;
            font-size: .8rem;
            color: #444;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .back-link a {
            color: #666;
            text-decoration: none;
            transition: color 200ms;
        }

        .back-link a:hover { color: #ffc06e; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <div class="brand">Justin Miranda</div>
    <p class="brand-sub">Champion Vocalist &nbsp;•&nbsp; Live Performer</p>

    <div class="card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to access the booking system</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="juan@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="login-btn">Login</button>
            <p id="status"></p>
        </form>
    </div>

    <div class="register-box">
        <p>Don't have an account yet?</p>
        <a href="Register.html" class="btn-outline">Create an Account</a>
    </div>

    <p class="back-link">
        <a href="HTML.html">← Continue as guest</a>
    </p>

    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp({
                apiKey: "AIzaSyDYRfZGOhmdyjNRFlNAsL15iEhPXlbCwxU",
                authDomain: "justins-booking.firebaseapp.com",
                projectId: "justins-booking",
                storageBucket: "justins-booking.firebasestorage.app",
                messagingSenderId: "1025617742708",
                appId: "1:1025617742708:web:09d4fcc825a6f3513d7a21"
            });
        }
        const db = firebase.firestore();

        document.getElementById("login-form").addEventListener("submit", async e => {
            e.preventDefault();
            const s   = document.getElementById("status");
            const btn = document.getElementById("login-btn");
            const email = document.getElementById("email").value.trim();
            const pass  = document.getElementById("password").value;

            btn.disabled = true;
            btn.textContent = "Logging in...";
            s.textContent = "";
            s.className = "";

            try {
                const result = await db.collection("users")
                    .where("email", "==", email)
                    .where("password", "==", pass)
                    .get();

                if (!result.empty) {
                    sessionStorage.setItem("loggedIn", "true");
                    sessionStorage.setItem("userName", result.docs[0].data().fullname);
                    s.textContent = "Login successful! Redirecting...";
                    s.className = "success";
                    setTimeout(() => window.location.href = "HTML.html", 1500);
                } else {
                    s.textContent = "Invalid email or password.";
                    s.className = "error";
                    btn.disabled = false;
                    btn.textContent = "Login";
                }
            } catch(err) {
                s.textContent = "Something went wrong. Please try again.";
                s.className = "error";
                btn.disabled = false;
                btn.textContent = "Login";
            }
        });
    </script>
</body>
</html>
